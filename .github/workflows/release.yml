name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            install: sudo apt-get update && sudo apt-get install -y libncurses-dev
            artifact-name: mini_htop-linux-x86_64
            archive-name: mini_htop-linux-x86_64.tar.gz
          - os: macos-latest
            install: brew install ncurses
            artifact-name: mini_htop-macos-universal
            archive-name: mini_htop-macos-universal.tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ncurses dependency
        run: ${{ matrix.install }}

      - name: Build binary
        run: make

      - name: Package artifact
        run: |
          mkdir -p dist
          cp mini_htop dist/
          tar -czf ${{ matrix.archive-name }} -C dist mini_htop

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.archive-name }}
          if-no-files-found: error

      - name: Clean workspace
        run: make clean

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          pattern: mini_htop-*
          merge-multiple: true
          path: artifacts

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mini_htop-linux-x86_64.tar.gz
            artifacts/mini_htop-macos-universal.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
